name: Build Ready2Play Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Android APK
        run: |
          # Cari folder letak project Android secara otomatis
          PROJECT_DIR=$(find . -name "settings.gradle" -exec dirname {} \; | head -n 1)
          echo "Building in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK Ready to Play
        uses: actions/upload-artifact@v4
        with:
          name: Ready2Play-Launcher-v1.0.apk
          path: |
            **/app/build/outputs/apk/debug/*.apk
